name: Validate static site

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export v1.3 public pages
        run: node scripts/export-v13-static.mjs
      - name: Check generated pages are committed
        run: git diff --exit-code
      - name: Check community JavaScript
        run: node --check community/js/community.js
      - name: Validate navigation and application links
        run: node --test tests/*.test.mjs
      - name: Validate community content
        run: node scripts/validate-content.mjs
      - name: Validate static site
        run: node scripts/validate-site.mjs
