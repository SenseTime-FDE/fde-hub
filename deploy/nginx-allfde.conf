server {
    listen 80;
    listen [::]:80;
    server_name allfde.com www.allfde.com;

    # Replace with the confirmed certificate paths before enabling HTTPS.
    # The HTTP block is intentionally kept explicit so a staging IP check
    # cannot be mistaken for a completed DNS/certificate cutover.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 12m;
    }
}

